# Local development dependencies only. No secrets: these are throwaway local values.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: factlens
      POSTGRES_PASSWORD: factlens
      POSTGRES_DB: factlens
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factlens"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  object-storage:
    # S3-compatible server for local development and the storage tests. RustFS, because the MinIO image
    # can no longer be pulled anonymously. It checks request signatures, as the tests require.
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    environment:
      RUSTFS_ACCESS_KEY: factlens
      RUSTFS_SECRET_KEY: factlens-local
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["9000:9000"]
    volumes: [s3data:/data]
volumes:
  pgdata:
  s3data:
