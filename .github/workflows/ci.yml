name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factlens
          POSTGRES_PASSWORD: factlens
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factlens"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://factlens:factlens@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      # A real S3-compatible server (RustFS, started below). It checks request signatures, unlike the
      # in-process stand-in used for the fast unit tests.
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY: rustfsadmin
      TEST_S3_SECRET_KEY: rustfsadmin-secret
      TEST_S3_REGION: us-east-1
      TEST_S3_VERIFIES_SIGNATURES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # GitHub service containers cannot take a command, so the S3 server is started here. The image is the
      # one in infrastructure/docker-compose.yml (pinned by digest); MinIO's image can no longer be pulled anonymously.
      - name: Start the S3-compatible server
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin -e RUSTFS_SECRET_KEY=rustfsadmin-secret \
            -e RUSTFS_VOLUMES=/data -e RUSTFS_ADDRESS=:9000 -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 2
          done
          docker logs s3
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: S3 server log on failure
        if: failure()
        run: docker logs s3
