name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factlens
          POSTGRES_PASSWORD: factlens
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factlens"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://factlens:factlens@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      # A real S3-compatible server (RustFS, started below). It checks request signatures, unlike the
      # in-process stand-in used for the fast unit tests.
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY: rustfsadmin
      TEST_S3_SECRET_KEY: rustfsadmin-secret
      TEST_S3_REGION: us-east-1
      TEST_S3_VERIFIES_SIGNATURES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # GitHub service containers cannot take a command, so the S3 server is started here. The image is the
      # one in infrastructure/docker-compose.yml (pinned by digest); MinIO's image can no longer be pulled anonymously.
      - name: Start the S3-compatible server
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin -e RUSTFS_SECRET_KEY=rustfsadmin-secret \
            -e RUSTFS_VOLUMES=/data -e RUSTFS_ADDRESS=:9000 -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 2
          done
          docker logs s3
          exit 1
      - run: pnpm install --frozen-lockfile
      # A production dependency with a high or critical advisory fails the build (ADR-061).
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      # Secrets anywhere in the history. The allowlist of test fixtures is in .gitleaks.toml; the image is pinned.
      - name: Secret scan
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --no-banner --config /repo/.gitleaks.toml
      - run: pnpm check
      # Browser tests (apps/web, Chromium: the gate, DR-289). The dev server is started by Playwright.
      - name: Install the Chromium browser
        run: pnpm --filter fact-lens-web exec playwright install --with-deps chromium
      - name: Browser tests (Chromium)
        run: pnpm --filter fact-lens-web test:e2e:chromium
      - name: Browser test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7
      - name: S3 server log on failure
        if: failure()
        run: docker logs s3

  # Images for the three services (D1), built for linux/amd64 on main only. Each must build, start
  # (the API and the worker refuse to start without configuration, the site serves) and pass a scan
  # for high and critical advisories with a fix (ADR-061). The pinned Trivy image is by digest.
  images:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          for svc in api worker web; do
            docker build --platform linux/amd64 -f "apps/$svc/Dockerfile" -t "factlens-$svc:ci" .
          done
      - name: The images start
        run: |
          for svc in api worker; do
            set +e
            out=$(docker run --rm "factlens-$svc:ci" 2>&1)
            code=$?
            set -e
            echo "$out" | tail -3
            if [ "$code" -eq 0 ] || ! echo "$out" | grep -q "Invalid environment"; then
              echo "$svc did not refuse a missing configuration with a clear message"
              exit 1
            fi
          done
          docker run -d --name web -p 3000:3000 factlens-web:ci
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "web answers on /"
              exit 0
            fi
            sleep 2
          done
          docker logs web
          exit 1
      - name: Scan the images for high and critical advisories
        run: |
          for svc in api worker web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "factlens-$svc:ci"
          done
